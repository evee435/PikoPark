name: CI/CD Pico Park

on:
  push:
    branches:
      - main

jobs:
  construir-imagen:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Iniciar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: host/Dockerfile
          push: true
          tags: evee435/picopark-server:latest

  desplegar-vm:
    needs: construir-imagen
    runs-on: self-hosted  # <--- Aquí se ejecuta en tu máquina virtual
    steps:
      - name: Descargar codigo actualizado
        uses: actions/checkout@v4

      - name: Actualizar y desplegar contenedores
        run: |
          docker compose pull
          docker compose up -d --remove-orphans

services:
  picopark-server:
    build:
      context: ./host
      dockerfile: Dockerfile
    container_name: picopark-server
    ports:
      - "3000:3000"
    environment:
      - IP_PUBLICA=10.56.31.30
    restart: unless-stopped

  picopark-web:
    build:
      context: ./host
      dockerfile: Dockerfile
    container_name: picopark-web
    command: npm run cliente -- --host 0.0.0.0
    ports:
      - "5173:5173"
    restart: unless-stopped
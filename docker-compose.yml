services:
  picopark-server:
    build:
      context: ./host
      dockerfile: Dockerfile
    container_name: picopark-server
    environment:
      - HOST_IP=10.56.31.30    ports:
      - "3000:3000"
      - "5173:5173"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "node"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
